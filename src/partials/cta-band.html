    <section class="cta-band">
      <div class="cta-band__bg" data-parallax="60">
        <picture>
          <source srcset="img/gallery-1.webp" type="image/webp">
          <img src="img/gallery-1.jpg" alt="" width="800" height="1000" loading="lazy" decoding="async">
        </picture>
      </div>

      <div class="cta-band__inner">
        <p class="eyebrow eyebrow--center" data-reveal="fade">Reservations</p>
        <h2 class="cta-band__title" data-reveal>Tables open thirty days ahead</h2>
        <p class="lead" data-reveal data-reveal-delay="80">
          The room holds twenty-eight. Friday and Saturday go quickly, and the
          chef's counter is released on the first of each month.
        </p>
        <div class="cta-band__actions" data-reveal data-reveal-delay="160">
          <a class="btn" href="contact.html">Reserve a table</a>
          <a class="btn btn--ghost" href="tel:{{site.contact.phoneHref}}">{{site.contact.phoneDisplay}}</a>
        </div>
        <p class="cta-band__note" data-reveal data-reveal-delay="220">
          Walk-ins welcome at the bar, every service.
        </p>
      </div>
    </section>
